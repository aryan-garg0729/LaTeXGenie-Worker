name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build CPU Docker image
        run: docker build -f Dockerfile.cpu -t latexgenie/latexgenie-worker:cpu .

      - name: Build GPU Docker image
        run: docker build -f Dockerfile.gpu -t latexgenie/latexgenie-worker:gpu .

      - name: Push CPU image to Docker Hub
        run: docker push latexgenie/latexgenie-worker:cpu
      
      - name: Push GPU image to Docker Hub
        run: docker push latexgenie/latexgenie-worker:gpu
