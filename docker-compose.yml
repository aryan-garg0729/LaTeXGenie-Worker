version: '3.8'

services:
  grobid:
    image: lfoppiano/grobid:latest-crf
    restart: unless-stopped
    environment:
      - CONTAINER_NAME=grobid


  app:
    build: .
    depends_on:
      - grobid
    environment:
      - CONTAINER_NAME=worker
      - INSTANCE_ID=1
    volumes:
      - ./logs:/logs

